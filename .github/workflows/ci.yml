name: ci
on:
  push:
  pull_request:
jobs:
  scorecard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: experiments/01-agent-readiness-scorecard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m scorecard examples/sample_portfolio.json > /dev/null

  web-parity:
    # The browser scorecard (docs/scorecard.js) must give identical results to the Python engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tests/web/gen_cases.py > parity.json
      - run: node tests/web/parity.mjs parity.json
